apiVersion: v1
kind: Secret
metadata:
  name: {{ include "airflow.fullname" . }}-git-credentials
  labels:
    tier: airflow
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  GITSYNC_USERNAME: {{ .Values.gitSync.username | quote }}
  GITSYNC_PASSWORD: {{ .Values.gitSync.password | quote }}
