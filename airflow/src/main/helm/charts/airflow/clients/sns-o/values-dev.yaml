# Despliegue en entorno de desarrollo
enabledReleases:
  - airflow

environment: dev

dags:
  gitSync:
    enabled: true
    repo: https://github.com/TSIB-Arch/genomics-cicd.git
    branch: main  # Necesario para sobrescribir valor por defecto
    rev: HEAD    # Necesario para sobrescribir valor por defecto
    ref: main    # Para git-sync v4, usar ref en lugar de branch
    depth: 1
    maxFailures: -1  # Permitir 3 fallos consecutivos antes de abortar
    subPath: "airflow/sns-o/dev/dags"  # Ruta relativa dentro del repo
    period: "300s"  # Para git-sync v4, usar period en lugar de wait
    # Credenciales
    credentialsSecret: airflow-git-credentials
    # Recursos (opcional pero recomendado)
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi

workers:
  persistence:
    enabled: true
    storageClassName: gp3
    size: 1Gi

triggerer:
  persistence:
    enabled: true
    storageClassName: gp3
    size: 1Gi

redis:
  enabled: true
  persistence:
    enabled: true
    storageClassName: gp3
    size: 1Gi

scheduler:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

ingress:
  apiServer:
    enabled: true
    ingressClassName: alb
    path: /
    pathType: "Prefix"
    hosts:
      - name: airflow.tsupreme.com
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-south-2:226585359982:certificate/14f8ef52-1741-4986-a9d8-46cbb4052eff
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-path: /api/v2/monitor/health
      alb.ingress.kubernetes.io/healthcheck-port: "8080"
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/success-codes: '200-399'
      alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=86400

webserver:
  enabled: true
  defaultUser:
    enabled: true
    username: genomica
    password: genomica_2025%
    email: admin@example.com
    firstName: admin
    lastName: user
    role: Admin

createUserJob:
  enabled: false
  useHelmHooks: false
  applyCustomEnv: false

migrateDatabaseJob:
  enabled: false
  useHelmHooks: false
  applyCustomEnv: false
