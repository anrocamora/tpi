{{- $ir := (.Values.nifi.ingressRoute | default dict) -}}
{{- if (index $ir "enabled") }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "nifi.fullname" . }}-route
  namespace: {{ include "nifi.namespace" . }}
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`{{ (index $ir "host") | default "" }}`) && PathPrefix(`{{ (index $ir "path") | default "/" }}`)
      kind: Rule
      services:
        - name: nifi
          port: 8443
          scheme: https
          serversTransport: {{ include "nifi.fullname" . }}-transport
      middlewares:
          - name: {{ include "nifi.fullname" . }}-headers
{{- end }}