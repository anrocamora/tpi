# Despliegue en entorno de PRE para cliente SNS-O
enabledReleases:
  - tpi-agent-service

# Entorno PRE
environment: pre

# Configuración de Spring
spring:
  profiles:
    name: pre

# Configuración de la imagen Docker
image:
  repository: "mtr.devops.telekom.de/genomica/tpi-agent-service"
  tag: "2026.03.01"

# Configuración del agente TPI
agent:
  id: tsupreme-agent-001
  client: snso
  env: pre
  # Montamos la raíz del share en /data
  # La aplicación detectará automáticamente los sources (subcarpetas de primer nivel)
  # y creará la estructura /data/{sourceName}/{agentId}/{source,completed,failed,logs}
  baseDir: /data
  upload:
    # Subidas paralelas: 10 threads para PRE (óptimo)
    # Mejora el rendimiento de 5h a ~45min con balance recursos/velocidad
    concurrentUploads: 10

# Configuración de Kafka con SSL
kafka:
  bootstrapServers: kafka-tls-kafka-bootstrap:9093
  ssl:
    enabled: true
    secretName: kafka-tls-secret
    keystorePassword: ''  # Set via external secret
    truststorePassword: ''  # Set via external secret
    keyPassword: ''  # Set via external secret

# Configuración de almacenamiento SMB (Samba)
storage:
  enabled: true
  type: smb
  smb:
    enabled: true
    # IMPORTANTE: estático (PV+PVC) para evitar directorios pvc-*
    provisioning: static
    # Ruta UNC proporcionada por Navarra (se normaliza a //host/share en el Deployment)
    share: "\\\\Dc1gpronas007\\MISEQ_PRE"
    secretName: "tpi-agent-smb-credentials-pre"
    domain: "ADMON-CFNAVARRA"
    username: "SVC_PLATGENOMICA_PRE"
    password: "XPszASAx5$QGs$"

    # Nombres deterministas
    pvName: "tpi-agent-service-snso-001-pre-smb-pv"
    pvcName: "tpi-agent-service-snso-001-pre-smb-pvc"
    volumeHandle: "tpi-agent-service-snso-001-pre-smb"

# Configuración de AWS S3 para PRE
# IMPORTANTE: Set credentials via external secret
aws:
  accessKeyId: ''  # Set via external secret
  secretAccessKey: ''  # Set via external secret
  region: us-east-1
  s3:
    bucket: genomica-pre
    endpoint: http://DC1GPRONAS007.admon-cfnavarra.es:9020
    basePath: agent/
    pathStyleAccess: true
    useSinglePartUpload: true

# Configuración del initContainer
initContainer:
  image: mtr.devops.telekom.de/genomica/busybox:1.32.0

# Configuración de la aplicación
application:
  name: tpi-agent-service
  replicas: 1

# Recursos del contenedor
# Optimizado para subida paralela (10 threads en PRE)
# Ver features/PARALLEL-UPLOAD-RESOURCES.md para detalles
resources:
  limits:
    memory: 6Gi      # Aumentado de 1.5Gi para soportar 10 threads paralelos
    cpu: 3000m       # Aumentado de 0.5 para throughput óptimo
  requests:
    memory: 3Gi      # Base para operación estable con 10 threads
    cpu: 1500m       # Mínimo para 10 threads

# Configuración del servicio
service:
  name: tpi-agent-service
  type: ClusterIP
  port: 8080
